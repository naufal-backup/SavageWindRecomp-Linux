# Builds the Linux AppImage in an Arch Linux container and uploads it as an artifact (and, on a tag, attaches it to
# the GitHub release). The same tooling `make appimage` uses (tools/linux/build_deps.sh, gen_helper.sh, package.sh),
# run directly inside the container instead of through podman (tools/linux/appimage.sh), so no daemon is needed.
#
# The build is Arch's, so the AppImage links against Arch's glibc and needs a recent distribution (Arch, CachyOS,
# Fedora, the newest Ubuntu/Debian). For a glibc-2.35 build use tools/linux/Containerfile (Ubuntu 22.04) locally:
# `make appimage`. No game files are involved: the AppImage builds the game code on the player's own machine.
name: release-linux

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
      tag:
        description: Release tag to create or update (for example v0.2.0-alpha.2). Empty means artifact only.
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: AppImage (${{ inputs.arch || 'x86_64' }})
    runs-on: ubuntu-latest
    # Arch, not Ubuntu: the rolling toolchain, and the same image tools/linux/Containerfile.arch describes. clang /
    # lld / llvm are recent enough for the __builtin_elementwise_* the lifted FP code uses (runtime/simd_fp.h).
    container: archlinux:base-devel
    timeout-minutes: 90
    env:
      ARCH: ${{ inputs.arch || 'x86_64' }}
      # Arch ships python (3.14+), not the Ubuntu image's python3.12 gen_helper.sh defaults to.
      PY: python3
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain and the SDL3 backend headers
        run: |
          pacman-key --init && pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed \
            ca-certificates curl git file xz unzip patchelf make cmake ninja pkgconf nasm python \
            clang lld llvm \
            libx11 libxext libxrandr libxcursor libxi libxss libxfixes libxtst \
            libxkbcommon wayland wayland-protocols libdecor libglvnd libdrm mesa \
            libpulse alsa-lib libpipewire dbus systemd-libs libibus \
            vulkan-headers vulkan-icd-loader

      # Arch's `llvm` package installs llvm-ar / llvm-nm / llvm-ranlib / llvm-strip / ld.lld in /usr/bin, the names
      # package.sh and build_deps.sh call. Check them instead of linking: an earlier version did `ln -sf` and failed
      # on itself ("'/usr/sbin/llvm-ar' and '/usr/bin/llvm-ar' are the same file").
      - name: Check the LLVM tools package.sh uses
        run: |
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-ranlib llvm-strip; do
            command -v "$t" >/dev/null || { echo "missing $t"; exit 1; }
          done
          clang --version | head -1

      # The pinned source tarballs (SDL3, FFmpeg, shaderc, Vulkan-Headers, VMA). Keyed on build_deps.sh: a version or
      # checksum change there fetches afresh. Without this a run pulls and unpacks all five every time.
      - name: Cache the pinned sources
        uses: actions/cache@v4
        with:
          path: build/linux/src
          key: linux-src-${{ hashFiles('tools/linux/build_deps.sh') }}

      - name: Build the dependencies (SDL3, LGPL FFmpeg, shaderc, headers)
        run: tools/linux/build_deps.sh "$ARCH"

      - name: Freeze the game code generator (swgen)
        run: tools/linux/gen_helper.sh "$ARCH"

      - name: Package the AppImage
        run: tools/linux/package.sh "$ARCH"

      - name: Checksums
        run: |
          cd build/dist
          sha256sum ./*.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Savage_Wind-${{ env.ARCH }}
          path: |
            build/dist/*.AppImage
            build/dist/SHA256SUMS
          if-no-files-found: error

      # The release. The tag comes from the push (v0.2.0-alpha.2) or the `tag` input on a manual run; empty means
      # artifact only. generate_release_notes makes the changelog: GitHub's own list of merged pull requests and
      # commits since the previous tag, so no changelog file has to be kept in sync.
      - name: Pick the project's own release notes, if any
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        id: notes
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if [ -f "docs/releases/$TAG.md" ]; then
            echo "file=docs/releases/$TAG.md" >> "$GITHUB_OUTPUT"
          else
            echo "no note for $TAG: the generated changelog only"
          fi

      - name: Publish the release with a changelog
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: Savage Wind Linux (${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }})
          # the changelog: merged pull requests and commits since the previous tag
          generate_release_notes: true
          # docs/releases/<tag>.md, when the repo has one, is prepended: the project's own write-up (what the upstream
          # Alpha 2 release has) plus the generated list. Empty when there is no note for the tag.
          body_path: ${{ steps.notes.outputs.file }}
          # -alpha.2 / -beta.1 tags are pre-releases, as upstream's are
          prerelease: ${{ contains(github.ref_type == 'tag' && github.ref_name || inputs.tag, 'alpha') || contains(github.ref_type == 'tag' && github.ref_name || inputs.tag, 'beta') }}
          files: |
            build/dist/*.AppImage
            build/dist/SHA256SUMS
          fail_on_unmatched_files: true
